<div class="row" *ngIf="!isCreateView">
    <div class="col-12">
        <div class="row">
            <div class="col-12 text-end">
                <button class="btn btn-success m-4" (click)="addNew()">Add New</button>
            </div>
        </div>

        <table class="table-bordered">
            <thead>
                <tr>
                    <th>Emp Code</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone No</th>
                    <th>Designation</th>
                    <th>Role</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor = "let emp of employeeList">
                    <td>{{emp.empCode}}</td>
                    <td>{{emp.empName}}</td>
                    <td>{{emp.empEmailId}}</td>
                    <td>{{emp.mobile}}</td>
                    <td>{{emp.empDesignation}}</td>
                    <td>{{emp.role}}</td>
                    <td class="pt-2 pb-2 mt-5">
                        <button class="btn btn-success" (click)="onEdit(emp.empId)">Edit</button>
                        <button class="btn btn-danger mx-1" (click)="onDelete(emp.empId)">Delete</button>

                    </td>
                </tr>
            </tbody>

            <tfoot></tfoot>
        </table>
    </div>
</div>

<div class="row" *ngIf="isCreateView">
    <div class="col-12">
        <div class="row">
            <div class="col-12 text-end">
                <button class="btn btn-success mt-3 me-5" (click)="isCreateView=false">Go to List View</button>
            </div>
        </div>
    </div>
</div>
